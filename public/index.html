<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thanglish Chat</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1d212b;
    --border: #262b36;
    --bubble-user: #3b82f6;
    --bubble-bot: #232733;
    --text: #e7e9ee;
    --muted: #8b90a0;
    --accent: #f97316;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  .app { display: flex; height: 100vh; }

  /* ---------- Sidebar (character list) ---------- */
  .sidebar {
    width: 300px;
    min-width: 300px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .sidebar-header {
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h1 {
    font-size: 17px;
    margin: 0 0 12px;
  }
  .new-char-btn {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
  }
  .char-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .char-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 4px;
    position: relative;
  }
  .char-item:hover { background: var(--panel-2); }
  .char-item.active { background: var(--panel-2); outline: 1px solid var(--accent); }
  .char-avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--bubble-bot);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 16px;
  }
  .char-meta { flex: 1; min-width: 0; }
  .char-name { font-size: 14px; font-weight: 600; }
  .char-preview {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .char-delete {
    opacity: 0;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
  }
  .char-item:hover .char-delete { opacity: 1; }
  .char-delete:hover { color: var(--danger); }
  .empty-list {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 30px 16px;
  }

  /* ---------- Main chat area ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .chat-header .char-avatar { width: 38px; height: 38px; }
  .chat-header-info h2 { font-size: 15px; margin: 0; }
  .chat-header-info p { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
  .no-char-selected {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
    flex-direction: column;
    gap: 10px;
    text-align: center;
    padding: 20px;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border-bottom-left-radius: 4px;
  }
  .msg.typing { color: var(--muted); font-style: italic; }
  .empty-chat {
    color: var(--muted);
    text-align: center;
    margin-top: 60px;
    font-size: 14px;
  }

  form.composer {
    display: flex;
    gap: 8px;
    padding: 16px 20px 20px;
  }
  form.composer input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14.5px;
    outline: none;
  }
  form.composer input:focus { border-color: var(--accent); }
  form.composer button {
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 14.5px;
  }
  form.composer button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 90%;
    max-width: 440px;
    padding: 22px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h2 { margin: 0 0 16px; font-size: 17px; }
  .modal label {
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    margin: 14px 0 6px;
  }
  .modal input[type="text"], .modal textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    outline: none;
    font-family: inherit;
    resize: vertical;
  }
  .modal textarea { min-height: 110px; line-height: 1.4; }
  .modal input[type="text"]:focus, .modal textarea:focus { border-color: var(--accent); }
  .avatar-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 6px;
  }
  .avatar-preview {
    width: 60px; height: 60px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--bubble-bot);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 20px;
    flex-shrink: 0;
  }
  .avatar-upload-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }
  .modal-actions button {
    flex: 1;
    padding: 11px;
    border-radius: 9px;
    border: none;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-cancel { background: var(--panel-2); color: var(--text); }
  .btn-save { background: var(--accent); color: white; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>Thanglish Chat</h1>
      <button class="new-char-btn" id="new-char-btn">+ New Character</button>
    </div>
    <div class="char-list" id="char-list"></div>
  </div>

  <div class="main" id="main"></div>
</div>

<div id="modal-root"></div>

<script>
  const STORAGE_KEY_CHARACTERS = "thanglish_characters";
  const STORAGE_KEY_CHATS_PREFIX = "thanglish_chat_";
  const API_URL = "/api/chat";

  let characters = loadCharacters();
  let activeCharId = characters.length ? characters[0].id : null;
  let editingCharId = null; // when set, modal is in edit mode

  // ---------- Storage helpers ----------
  function loadCharacters() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_CHARACTERS);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  }
  function saveCharacters() {
    localStorage.setItem(STORAGE_KEY_CHARACTERS, JSON.stringify(characters));
  }
  function loadChat(charId) {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_CHATS_PREFIX + charId);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  }
  function saveChat(charId, history) {
    localStorage.setItem(STORAGE_KEY_CHATS_PREFIX + charId, JSON.stringify(history));
  }
  function deleteChat(charId) {
    localStorage.removeItem(STORAGE_KEY_CHATS_PREFIX + charId);
  }

  function initials(name) {
    return (name || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]?.toUpperCase() || "").join("");
  }

  // ---------- Sidebar rendering ----------
  function renderSidebar() {
    const list = document.getElementById("char-list");
    if (!characters.length) {
      list.innerHTML = `<div class="empty-list">No characters yet.<br>Create one to start chatting.</div>`;
      return;
    }
    list.innerHTML = "";
    characters.forEach(c => {
      const hist = loadChat(c.id);
      const last = hist.length ? hist[hist.length - 1].content : "No messages yet";
      const item = document.createElement("div");
      item.className = "char-item" + (c.id === activeCharId ? " active" : "");
      item.innerHTML = `
        ${c.avatar
          ? `<img class="char-avatar" src="${c.avatar}" />`
          : `<div class="char-avatar">${initials(c.name)}</div>`}
        <div class="char-meta">
          <div class="char-name">${escapeHtml(c.name)}</div>
          <div class="char-preview">${escapeHtml(last)}</div>
        </div>
        <button class="char-delete" title="Delete character">✕</button>
      `;
      item.addEventListener("click", (e) => {
        if (e.target.closest(".char-delete")) return;
        activeCharId = c.id;
        renderSidebar();
        renderMain();
      });
      item.querySelector(".char-delete").addEventListener("click", () => {
        if (!confirm(`Delete "${c.name}" and its chat history?`)) return;
        characters = characters.filter(x => x.id !== c.id);
        deleteChat(c.id);
        saveCharacters();
        if (activeCharId === c.id) {
          activeCharId = characters.length ? characters[0].id : null;
        }
        renderSidebar();
        renderMain();
      });
      list.appendChild(item);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  // ---------- Main chat area rendering ----------
  function renderMain() {
    const main = document.getElementById("main");
    const char = characters.find(c => c.id === activeCharId);

    if (!char) {
      main.innerHTML = `
        <div class="no-char-selected">
          <div style="font-size:34px;">💬</div>
          <div>No character selected.<br>Create a new character to start chatting.</div>
        </div>`;
      return;
    }

    main.innerHTML = `
      <div class="chat-header">
        ${char.avatar
          ? `<img class="char-avatar" src="${char.avatar}" />`
          : `<div class="char-avatar">${initials(char.name)}</div>`}
        <div class="chat-header-info">
          <h2>${escapeHtml(char.name)}</h2>
          <p>${escapeHtml((char.personality || "").slice(0, 60))}${(char.personality || "").length > 60 ? "…" : ""}</p>
        </div>
        <div style="margin-left:auto; display:flex; gap:8px;">
          <button class="avatar-upload-btn" id="edit-char-btn">Edit</button>
        </div>
      </div>
      <div id="chat"></div>
      <form class="composer" id="chat-form">
        <input id="input" type="text" placeholder="Type your message..." autocomplete="off" />
        <button id="send-btn" type="submit">Send</button>
      </form>
    `;

    document.getElementById("edit-char-btn").addEventListener("click", () => openCharacterModal(char.id));

    const chatEl = document.getElementById("chat");
    const history = loadChat(char.id);
    if (!history.length) {
      chatEl.innerHTML = `<div class="empty-chat">Start chatting with ${escapeHtml(char.name)}...</div>`;
    } else {
      history.forEach(m => addMessageEl(chatEl, m.role, m.content));
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    const form = document.getElementById("chat-form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      const empty = chatEl.querySelector(".empty-chat");
      if (empty) empty.remove();

      addMessageEl(chatEl, "user", text);
      let hist = loadChat(char.id);
      hist.push({ role: "user", content: text });
      saveChat(char.id, hist);
      renderSidebar();

      input.value = "";
      sendBtn.disabled = true;
      const typingEl = addTypingEl(chatEl);

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: hist.map(m => ({ role: m.role, content: m.content })),
            characterPrompt: char.personality || "",
          }),
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || "Request failed");
        }

        const data = await res.json();
        typingEl.remove();
        addMessageEl(chatEl, "bot", data.reply);
        hist = loadChat(char.id);
        hist.push({ role: "assistant", content: data.reply });
        saveChat(char.id, hist);
        renderSidebar();
      } catch (err) {
        typingEl.remove();
        addMessageEl(chatEl, "bot", "Aiyo sorry, error vandhuduchu: " + err.message);
      } finally {
        sendBtn.disabled = false;
        input.focus();
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    });
  }

  function addMessageEl(chatEl, role, text) {
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "bot");
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }
  function addTypingEl(chatEl) {
    const div = document.createElement("div");
    div.className = "msg bot typing";
    div.textContent = "typing...";
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  // ---------- Character creation / edit modal ----------
  function openCharacterModal(charId) {
    editingCharId = charId || null;
    const existing = charId ? characters.find(c => c.id === charId) : null;
    let avatarData = existing?.avatar || "";

    const root = document.getElementById("modal-root");
    root.innerHTML = `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
          <h2>${existing ? "Edit Character" : "New Character"}</h2>

          <label>Profile picture</label>
          <div class="avatar-row">
            ${avatarData
              ? `<img class="avatar-preview" id="avatar-preview-img" src="${avatarData}" />`
              : `<div class="avatar-preview" id="avatar-preview-img">?</div>`}
            <input type="file" accept="image/*" id="avatar-file" style="display:none;" />
            <button type="button" class="avatar-upload-btn" id="avatar-upload-btn">Upload image</button>
          </div>

          <label>Name</label>
          <input type="text" id="char-name" placeholder="e.g. Arjun, Meera..." value="${existing ? escapeHtml(existing.name) : ""}" />

          <label>Personality / character description</label>
          <textarea id="char-personality" placeholder="Describe who they are — personality, tone, background, how they talk, relationship to the user, quirks, etc.">${existing ? escapeHtml(existing.personality || "") : ""}</textarea>
          <div class="hint">This fully shapes how they respond — be as detailed as you like.</div>

          <div class="modal-actions">
            <button type="button" class="btn-cancel" id="modal-cancel">Cancel</button>
            <button type="button" class="btn-save" id="modal-save">${existing ? "Save changes" : "Create character"}</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById("avatar-upload-btn").addEventListener("click", () => {
      document.getElementById("avatar-file").click();
    });
    document.getElementById("avatar-file").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        avatarData = reader.result;
        const img = document.getElementById("avatar-preview-img");
        img.outerHTML = `<img class="avatar-preview" id="avatar-preview-img" src="${avatarData}" />`;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("modal-cancel").addEventListener("click", closeModal);
    document.getElementById("modal-overlay").addEventListener("click", (e) => {
      if (e.target.id === "modal-overlay") closeModal();
    });

    document.getElementById("modal-save").addEventListener("click", () => {
      const name = document.getElementById("char-name").value.trim();
      const personality = document.getElementById("char-personality").value.trim();
      if (!name) { alert("Please enter a name."); return; }

      if (existing) {
        existing.name = name;
        existing.personality = personality;
        existing.avatar = avatarData;
      } else {
        const newChar = {
          id: "char_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8),
          name, personality, avatar: avatarData,
        };
        characters.push(newChar);
        activeCharId = newChar.id;
      }
      saveCharacters();
      closeModal();
      renderSidebar();
      renderMain();
    });
  }

  function closeModal() {
    document.getElementById("modal-root").innerHTML = "";
    editingCharId = null;
  }

  document.getElementById("new-char-btn").addEventListener("click", () => openCharacterModal(null));

  // ---------- Init ----------
  renderSidebar();
  renderMain();
</script>

</body>
</html>
