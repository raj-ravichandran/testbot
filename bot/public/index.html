<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thanglish Bot</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --bubble-user: #3b82f6;
    --bubble-bot: #232733;
    --text: #e7e9ee;
    --muted: #8b90a0;
    --accent: #f97316;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  header {
    padding: 16px 20px;
    background: var(--panel);
    border-bottom: 1px solid #262b36;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #22c55e;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  header p {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border-bottom-left-radius: 4px;
  }
  .msg.typing {
    color: var(--muted);
    font-style: italic;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 16px 20px 20px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid #2b303c;
    background: var(--panel);
    color: var(--text);
    font-size: 14.5px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 14.5px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty {
    color: var(--muted);
    text-align: center;
    margin-top: 60px;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <div>
    <h1>Thanglish Bot</h1>
    <p>Pesunga free-ah, Tamil + English mix la 🙂</p>
  </div>
</header>

<div id="chat">
  <div class="empty">Vanakkam! Enna venum sollunga... type panni start pannunga 👋</div>
</div>

<form id="chat-form">
  <input id="input" type="text" placeholder="Type your message..." autocomplete="off" />
  <button id="send-btn" type="submit">Send</button>
</form>

<script>
  const chatEl = document.getElementById('chat');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');

  // Backend endpoint - relative path works once deployed on Vercel
  const API_URL = '/api/chat';

  let history = [];

  function addMessage(role, text) {
    const empty = chatEl.querySelector('.empty');
    if (empty) empty.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'msg bot typing';
    div.textContent = 'typing...';
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    sendBtn.disabled = true;

    const typingEl = addTyping();

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || 'Request failed');
      }

      const data = await res.json();
      typingEl.remove();
      addMessage('bot', data.reply);
      history.push({ role: 'assistant', content: data.reply });
    } catch (err) {
      typingEl.remove();
      addMessage('bot', 'Aiyo sorry, error vandhuduchu: ' + err.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
